<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://player.bilibili.com https://www.bilibili.com; media-src https: blob:;"
    />
    <title>原视频</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0c;
        color: #eee;
        font-family: 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .bar {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        background: #161618;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-app-region: drag;
      }
      .bar .title {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        opacity: 0.85;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bar button {
        -webkit-app-region: no-drag;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: #eee;
        border-radius: 6px;
        height: 26px;
        padding: 0 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .bar button:hover {
        background: rgba(250, 45, 85, 0.2);
        border-color: rgba(250, 45, 85, 0.45);
      }
      .bar button.primary {
        background: #fa2d55;
        border-color: #fa2d55;
      }
      .frame-wrap {
        height: calc(100% - 40px);
        background: #000;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      .empty {
        height: 100%;
        display: grid;
        place-content: center;
        color: rgba(255, 255, 255, 0.55);
        font-size: 13px;
        gap: 10px;
        text-align: center;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="title" id="title">原视频</div>
      <button type="button" id="btnEnlarge" title="放大窗口">放大</button>
      <button type="button" id="btnFs" title="全屏">全屏</button>
      <button type="button" class="primary" id="btnWeb" title="在浏览器打开 B 站">原网页</button>
      <button type="button" id="btnClose">关闭</button>
    </div>
    <div class="frame-wrap" id="wrap">
      <div class="empty" id="empty">正在加载原视频…</div>
    </div>
    <script src="video.js"></script>
  </body>
</html>
